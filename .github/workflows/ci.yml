name: Validate Trace

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Model tests
        run: make test-js
      - name: Source tests
        run: make test-shell
      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh
